name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package
        run: |
          rm -f picodeck-blockexe-*.zip
          sh tools/stage.sh build/pkg
          (cd build/pkg && zip -9r "$GITHUB_WORKSPACE/picodeck-blockexe-${GITHUB_REF_NAME//\//-}.zip" .)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: picodeck-blockexe
          path: picodeck-blockexe-*.zip

      - name: Check app.json version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(python3 -c 'import json; print(json.load(open("app.json"))["version"])')"
          if [ "$VER" != "$TAG" ]; then
            echo "app.json version '$VER' does not match tag '$TAG'" >&2
            exit 1
          fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: picodeck-blockexe-*.zip
          generate_release_notes: true
